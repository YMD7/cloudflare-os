packages:
  - packages/*

# The toolchain versions every package shares. Declared once here so a bump is one edit rather than
# needing to hand edit a bunch of different package.json files.
catalog:
  '@cloudflare/vitest-pool-workers': ^0.20.2
  capnweb: ^0.12.0
  # Exact: pinned in lockstep with capnweb (declared as a >=0.7.0 peer)
  capnweb-validate: 0.3.0
  # Exact: TypeScript 7 (tsgo). Type-checking runs on the native compiler. Build-time
  # transpilers that need the JS compiler API (scripts/build-gatekeeper-configurator.ts)
  # use the root "typescript6" npm alias instead; capnweb-validate ships its own
  # JS-based compiler dependency since 0.2.4.
  typescript: 7.0.2
  # Exact, not ranged: the transform has to stay on esbuild. Oxc does not lower the Stage-3
  # decorators capnweb-validate's `@validateRpc()` relies on (cloudflare/workers-sdk#12626).
  vite: 7.3.6
  vite-plus: ^0.2.8
  vitest: ^4.1.11
  wrangler: ^4.119.0

overrides:
  # Vite+の固定依存も含め、Vitest 4系をGHSA-82fw-gwwq-j7x9の修正版に統一する。
  vitest: 4.1.11
  '@vitest/browser': 4.1.11
  '@vitest/browser-preview': 4.1.11
  '@vitest/expect': 4.1.11
  '@vitest/mocker': 4.1.11
  '@vitest/pretty-format': 4.1.11
  '@vitest/runner': 4.1.11
  '@vitest/snapshot': 4.1.11
  '@vitest/spy': 4.1.11
  '@vitest/utils': 4.1.11
  # Miniflareの固定依存を修正する。Wranglerとworkerdの更新は行わない。
  'sharp@0.35.2': 0.35.4
  'undici@>=7.0.0 <7.29.1': 7.29.1
  # GHSA-2v37-7h3g-55p8、およびIP解析・HTMLサニタイズの修正版。
  'nanoid@>=3.0.0 <3.3.18': 3.3.18
  'ip-address@>=10.0.0 <10.7.1': 10.7.1
  'dompurify@>=3.0.0 <3.4.16': 3.4.16
  # Vitest peers can resolve vite@latest, so the version is pinned rather than ranged. Points at the
  # catalog so this and the manifests can't disagree: a catalog only covers what a workspace
  # manifest declares itself, and the override is what reaches vite as somebody else's peer.
  vite: "catalog:"
  # minimumReleaseAge gates direct deps but not these two, so pin them to the last
  # mature release (CI verifies every lockfile entry against the release-age policy):
  # - @types/node arrives as an optional vite/vitest peer resolved to `latest`.
  # - @lezer/markdown is a deep transitive of @codemirror/lang-markdown.
  '@types/node': 26.1.0
  '@lezer/markdown': 1.6.4

# Reject dependency versions published within this many minutes (24h), matching the
# CI supply-chain policy so local installs can't commit a too-fresh lockfile.
minimumReleaseAge: 1440

minimumReleaseAgeExclude:
  - capnweb
  - capnweb-validate
  - workerd
  - "@cloudflare/workerd-*"

allowBuilds:
  '@google/genai': true
  core-js-pure: true
  esbuild: true
  protobufjs: true
  sharp: true
  workerd: true

patchedDependencies:
  monaco-editor@0.56.0: patches/monaco-editor@0.56.0.patch
